<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ghost Trading browser checks</title></head>
<body>
<h1>Ghost Trading browser checks</h1>
<p id="status">Running...</p>
<pre id="log"></pre>
<script>
(async () => {
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const check = (ok, message) => { if (!ok) throw new Error(message); log.textContent += 'PASS: ' + message + '\n'; };
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  const rejects = (fn, contains) => { try { fn(); } catch (error) { return error.message.includes(contains); } return false; };
  const KEY = 'ghost-terminal-v2';
  localStorage.removeItem(KEY);
  try {
    const response = await fetch('./index.html');
    check(response.ok, 'dashboard loads');
    const source = await response.text();
    const bootstrap = '<script>window.__errors=[];window.addEventListener("error",function(e){window.__errors.push(e.message)});' +
      'class FakeSocket{constructor(url){this.url=url;this.sent=[];this.readyState=0;FakeSocket.last=this;}' +
      'send(d){this.sent.push(JSON.parse(d));}close(){this.readyState=3;if(this.onclose)this.onclose();}' +
      'open(){this.readyState=1;if(this.onopen)this.onopen();}' +
      'push(o){if(this.onmessage)this.onmessage({data:JSON.stringify(o)});}}' +
      'window.WebSocket=FakeSocket;<\/script>';
    const boot = async () => {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:375px;height:800px;border:0';
      f.srcdoc = source.replace('<script>', () => bootstrap + '<script>');
      const ready = new Promise(resolve => { f.onload = resolve; });
      document.body.append(f); await ready;
      return f;
    };
    let frame = await boot();
    let win = frame.contentWindow, doc = frame.contentDocument;
    const T = () => win.GhostTerminal;
    const ui = id => doc.getElementById(id);
    const draw = () => T().render();
    check(!!win.GhostTerminal && win.__errors.length === 0, 'terminal starts with no uncaught errors');
    check(doc.querySelector('meta[name="viewport"]') !== null, 'mobile viewport is configured');
    check(doc.documentElement.scrollWidth <= 375, 'mobile page does not scroll sideways');
    check(doc.querySelector('symbol#ghostlogo') !== null && doc.querySelectorAll('.brand svg use').length >= 1, 'Ghost logo is on the page');
    check(doc.body.textContent.includes('real-money trading is not enabled'), 'page says real-money trading is not enabled');
    check(ui('sBal').textContent === '5.0000 SOL', 'starting paper balance is 5 SOL');

    /* paper engine rules */
    const P = T().Paper, now = Date.UTC(2026, 10, 18, 12, 0, 0);
    const base = {mint: 'm', symbol: 'TST', mark: 30, size: 0.1, tp: 30, sl: 15, holdMin: 10, fee: 2};
    const s = P.create(now);
    check(near(s.balance, 5), 'engine starts at 5 SOL');
    check(rejects(() => P.open(s, Object.assign({}, base, {size: 5.01}), now), 'Size'), 'positions above 5 SOL are rejected');
    const full = P.create(now); P.open(full, Object.assign({}, base, {size: 5}), now);
    check(near(full.balance, 0), 'a full 5 SOL position is allowed');
    check(rejects(() => P.open(full, base, now), 'Insufficient'), 'cannot open without balance');
    check(rejects(() => P.open(s, Object.assign({}, base, {mark: 0}), now), 'Entry market cap'), 'invalid entry price is rejected');
    check(rejects(() => P.open(s, Object.assign({}, base, {sl: 0}), now), 'Stop loss'), 'invalid stop loss is rejected');
    const p1 = P.open(s, base, now), p2 = P.open(s, Object.assign({}, base, {mint: 'm2'}), now);
    check(s.positions.length === 2 && near(s.balance, 4.8), 'many positions can be open at once');
    const pnl = P.close(s, p1.id, 60, 'manual', now);
    check(near(pnl, 0.09208) && near(s.balance, 4.9 + 0.1 + 0.09208 - 0.1), 'P&L includes costs on both sides');
    check(P.signal(p2, 40, now) === 'take profit' && P.signal(p2, 25, now) === 'stop loss' && P.signal(p2, 31, now + 600000) === 'max hold' && P.signal(p2, 31, now + 1000) === null, 'exit rules: take profit, stop loss, max hold');
    const many = P.create(now);
    for (let i = 0; i < 10; i++) { P.open(many, Object.assign({}, base, {fee: 0}), now); P.close(many, many.positions[0].id, 30, 'manual', now); }
    check(many.trades.length === 10, 'no daily limit: 10 entries in one day all work');
    const weekly = P.create(now); weekly.weekPnl = -4;
    check(rejects(() => P.open(weekly, base, now), 'Weekly'), 'weekly 4 SOL loss stop blocks new trades');

    /* add any position (UI) */
    ui('tSize').value = '0.1';
    ui('mSym').value = 'AAA'; ui('mMc').value = '30'; ui('manualBtn').click();
    ui('mSym').value = 'BBB'; ui('mMc').value = '10'; ui('manualBtn').click(); draw();
    check(ui('sCount').textContent === '2' && ui('posBody').textContent.includes('AAA') && ui('posBody').textContent.includes('BBB'), 'any positions can be added by hand');
    ui('closeAllBtn').click(); draw();
    check(ui('sCount').textContent === '0' && ui('histBody').children.length === 2, 'close all closes every position');
    ui('resetBtn').click(); draw();
    check(ui('sBal').textContent === '5.0000 SOL', 'reset returns the paper account to 5 SOL');
    ui('tSize').value = '0.5';

    /* live feed */
    ui('connectBtn').click();
    let sock = win.WebSocket.last; sock.open();
    check(sock.url === 'wss://pumpportal.fun/api/data' && sock.sent[0].method === 'subscribeNewToken', 'connects to the pump.fun PumpPortal feed and subscribes to new launches');
    sock.push({txType: 'create', mint: 'mintA', name: '<img src=x onerror=alert(1)>', symbol: 'AAA', marketCapSol: 30}); draw();
    check(ui('feed').textContent.includes('<img src=x onerror=alert(1)>') && !ui('feed').querySelector('img'), 'untrusted launch names are shown as text');
    ui('feed').querySelector('button[data-buy]').click(); draw();
    check(ui('sCount').textContent === '1' && sock.sent.some(m => m.method === 'subscribeTokenTrade' && m.keys[0] === 'mintA'), 'buying a launch opens a position and subscribes to its live trades');
    sock.push({txType: 'buy', mint: 'other', marketCapSol: 999}); draw();
    check(ui('sCount').textContent === '1', 'trades for other tokens do not touch the position');
    sock.push({txType: 'buy', mint: 'mintA', marketCapSol: 40}); draw();
    check(ui('sOpenPnl').textContent === '+0.1403 SOL' && ui('selMc').textContent === '40.00', 'open P&L follows the live market cap');
    sock.push({txType: 'buy', mint: 'mintA', marketCapSol: 45}); draw();
    check(ui('sCount').textContent === '0' && ui('sBal').textContent === '5.2203 SOL' && ui('histBody').textContent.includes('take profit'), 'take profit closes the position on a live price');

    /* auto-rotate */
    ui('tRotate').click();
    sock.push({txType: 'create', mint: 'mintB', name: 'Beta', symbol: 'BBB', marketCapSol: 20}); draw();
    check(ui('sCount').textContent === '1' && ui('posBody').textContent.includes('BBB'), 'auto-rotate buys the next new launch');
    sock.push({txType: 'buy', mint: 'mintB', marketCapSol: 30}); draw();
    check(ui('sCount').textContent === '0' && ui('sBal').textContent === '5.4406 SOL', 'rotation position takes profit');
    sock.push({txType: 'create', mint: 'mintC', name: 'Gamma', symbol: 'CCC', marketCapSol: 10}); draw();
    check(ui('sCount').textContent === '1' && ui('posBody').textContent.includes('CCC') && ui('sBal').textContent === '4.9406 SOL', 'after the exit it jumps to the next launch');

    /* reload recovery */
    const saved = JSON.parse(localStorage.getItem(KEY));
    check(saved.wantFeed === true && saved.paper.positions.length === 1 && saved.rotate === true, 'positions and feed preference are saved');
    frame.remove();
    frame = await boot(); win = frame.contentWindow; doc = frame.contentDocument;
    sock = win.WebSocket.last;
    check(!!sock && sock.readyState === 0 && ui('feedText').textContent === 'Reconnecting...', 'reload reconnects the feed automatically');
    sock.open(); draw();
    check(ui('feedText').textContent === 'Live pump.fun feed' && sock.sent.some(m => m.method === 'subscribeTokenTrade' && m.keys[0] === 'mintC'), 'reconnected feed re-subscribes to the restored position');
    check(ui('sCount').textContent === '1' && ui('posBody').textContent.includes('CCC') && ui('sBal').textContent === '4.9406 SOL', 'reload restores the open position and balance');
    ui('posBody').querySelector('button[data-close]').click(); draw();
    check(ui('sCount').textContent === '0' && win.__errors.length === 0, 'restored position can be closed without errors');
    frame.remove();

    /* corrupt storage */
    localStorage.setItem(KEY, '{broken');
    frame = await boot(); win = frame.contentWindow; doc = frame.contentDocument;
    check(win.__errors.length === 0 && ui('sBal').textContent === '5.0000 SOL', 'corrupt storage starts a fresh account without errors');
    frame.remove(); localStorage.removeItem(KEY);
    status.textContent = 'ALL TESTS PASSED'; status.id = 'pass';
  } catch (error) {
    status.textContent = 'FAIL: ' + (error.stack || error);
    status.id = 'fail';
    console.error(status.textContent);
  }
})();
</script>
</body>
</html>
