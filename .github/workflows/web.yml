name: Web dashboard checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          node - <<'NODE'
          const http = require('http');
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const server = http.createServer((req, res) => {
              const path = req.url === '/index.html' ? 'index.html' : req.url === '/ghost-speak-web.html' ? 'ghost-speak-web.html' : null;
              if (!path) { res.writeHead(404).end(); return; }
              res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
              res.end(fs.readFileSync(path));
            });
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            const browser = await chromium.launch({headless: true});
            try {
              const page = await browser.newPage();
              page.on('pageerror', error => console.error('FAIL: uncaught error:', error));
              await page.goto(`http://127.0.0.1:${server.address().port}/ghost-speak-web.html`);
              await page.waitForSelector('#pass, #fail', {timeout: 15000});
              const log = await page.locator('#log').textContent();
              console.log(log);
              if (await page.locator('#fail').count()) throw new Error(await page.locator('#fail').textContent());
              console.log('ALL TESTS PASSED');
            } finally {
              await browser.close();
              server.close();
            }
          })().catch(error => { console.error('FAIL:', error); process.exitCode = 1; });
          NODE
      - name: Run trading terminal checks
        run: node tests/terminal.test.js
      - name: Run pump bot checks
        run: node tests/pumpbot.test.js
